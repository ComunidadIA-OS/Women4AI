[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "explicometro"
version = "0.1.0"
description = "Métricas abiertas de presencia, protagonismo y conductas asociadas al mansplaining en debates y tertulias (castellano y catalán)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Equipo Explicómetro" }]
keywords = ["speech", "diarization", "gender-bias", "nlp", "spanish", "catalan"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Núcleo ligero: suficiente para --dry-run en CPU, tests y CI.
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "openai>=1.40",
]

[project.optional-dependencies]
# Modelos. V100S: fp16/int8, sin bf16 ni flash-attention.
gpu = [
  "torch>=2.3",
  "torchaudio>=2.3",
  "silero-vad>=5.1",
  "pyannote.audio>=3.1,<3.2",
  "faster-whisper>=1.0",
  "speechbrain>=1.0",
  "transformers>=4.44",
  "sentence-transformers>=3.0",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]
app = ["streamlit>=1.46"]
dev = ["ruff>=0.6", "pytest>=8", "pytest-cov>=5"]

[project.scripts]
explicometro = "explicometro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/explicometro"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts", "app"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # acentos y comillas tipográficas en español

[tool.ruff.lint.isort]
known-first-party = ["explicometro", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"
markers = ["gpu: necesita GPU y extras [gpu] (se excluye en CI)"]
